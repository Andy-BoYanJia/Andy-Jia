<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sport and Learner.">
  <meta name="theme-color" content="#cce4f4">
  <title>Sport & Learner</title>
  <link rel="stylesheet" href="styles.css?v=portrait-colors-6">
  <link rel="stylesheet" href="home-flight.css?v=12">
  <noscript><style>.flight-assembly[data-arrival="pending"]{visibility:visible}</style></noscript>
  <script src="home-flight.js?v=9" defer></script>
</head>
<body class="flight-page">
<main class="flight-home">
  <div class="sky" aria-hidden="true">
    <div class="sky__glow"></div><div class="sky__cloud sky__cloud--one"></div>
    <div class="sky__cloud sky__cloud--two"></div><div class="sky__cloud sky__cloud--three"></div>
  </div>
  <header class="flight-nav">
    <a class="flight-contact" href="learn-with-me.html"><span class="flight-contact__label">Learn with me</span><span class="flight-contact__arrow" aria-hidden="true">↗</span></a>
  </header>
  <div class="flight-stage">
    <div class="flight-assembly" data-arrival="pending">
      <div class="flight-scene">
        <div class="wind" aria-hidden="true">
          <svg class="wind__lines" viewBox="0 0 1000 500" fill="none" preserveAspectRatio="none">
            <defs><linearGradient id="wind-fade"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
            <g stroke="url(#wind-fade)" stroke-linecap="round">
              <path class="wind__ribbon" d="M0 155 C200 80 390 240 630 190 S860 145 1000 225" stroke-width="16"/>
              <path d="M0 130 C200 55 390 215 630 165 S860 120 1000 200" stroke-width="1.5"/>
              <path d="M0 165 C200 90 390 250 630 200 S860 155 1000 235" stroke-width="2"/>
              <path class="wind__ribbon" d="M0 320 C220 390 340 250 560 310 S810 330 1000 260" stroke-width="22"/>
              <path d="M0 300 C220 370 340 230 560 290 S810 310 1000 240" stroke-width="1.5"/>
              <path d="M0 340 C220 410 340 270 560 330 S810 350 1000 280" stroke-width="1"/>
              <path class="wind__streak" d="M30 220 C260 160 470 300 800 230" stroke-width="2"/>
              <path class="wind__streak wind__streak--second" d="M90 390 C290 440 540 340 900 305" stroke-width="2"/>
            </g>
          </svg>
        </div>
        <div class="wind-words">
          <a class="wind-word wind-word--sport" href="sport.html">Sport<span class="wind-word__arrow" aria-hidden="true">↗</span></a>
          <span class="wind-word wind-word--learner">Learner</span>
        </div>
        <div class="disc-shadow" aria-hidden="true"></div>
        <div class="flight-disc">
          <img class="flight-disc__image" src="assets/frisbee-flight.png" alt="Ivory white frisbee tilted to reveal its top" draggable="false" fetchpriority="high">
          <!-- A transparent full-body portrait can be placed here later. Its feet anchor to the top of the disc. -->
          <span class="flight-rider" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
